<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Todo List</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div>
                <h1>Tasks</h1>
                <p class="date" id="current-date"></p>
            </div>
            <div class="stats">
                <span id="pending-count">0 pending</span>
            </div>
        </header>

        <form id="todo-form" class="input-section">
            <input type="text" id="todo-input" placeholder="Add a new task..." autocomplete="off" required>
            <button type="submit" class="add-btn"><i class="fas fa-plus"></i></button>
        </form>

        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>

        <div class="todo-list-container">
            <ul id="todo-list">
                <!-- Todo items will be injected here via JS -->
            </ul>
        </div>

        <div class="app-footer">
            <button id="clear-completed" class="clear-btn">Clear Completed</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
